
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seven Online</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ONLINE CARD GAME</div>
        <h1>SEVEN</h1>
      </div>
      <div id="roomBadge" class="room-badge hidden"></div>
    </header>

    <main>
      <section id="homeScreen" class="panel home">
        <h2>Play Seven Online</h2>
        <p>Create a private room or join your friends with a 5-character room code.</p>

        <label>Your name</label>
        <input id="nameInput" maxlength="18" placeholder="Player name" />

        <div class="home-actions">
          <button id="createBtn" class="btn primary">Create Room</button>
          <div class="join-box">
            <input id="roomInput" maxlength="5" placeholder="ROOM" />
            <button id="joinBtn" class="btn secondary">Join Room</button>
          </div>
        </div>

        <div id="homeError" class="error"></div>
      </section>

      <section id="lobbyScreen" class="panel hidden">
        <div class="section-head">
          <div>
            <div class="eyebrow">LOBBY</div>
            <h2>Room <span id="lobbyCode"></span></h2>
          </div>
          <button id="copyCodeBtn" class="btn secondary">Copy Code</button>
        </div>

        <div id="lobbyPlayers" class="player-list"></div>

        <div class="lobby-actions">
          <button id="readyBtn" class="btn secondary">Ready</button>
          <button id="startBtn" class="btn primary hidden">Start Match</button>
        </div>
        <div id="lobbyMessage" class="muted"></div>
      </section>

      <section id="gameScreen" class="hidden">
        <div id="scoreRow" class="score-row"></div>

        <div class="table">
          <div class="table-top">
            <div id="turnText" class="turn-text"></div>
            <div id="lastEvent" class="last-event"></div>
          </div>
          <div id="board" class="board"></div>
        </div>

        <section class="panel hand-panel">
          <div class="hand-top">
            <div>
              <div class="eyebrow">YOUR HAND</div>
              <h2 id="youName"></h2>
            </div>
            <div class="mode-toggle">
              <button id="playModeBtn" class="mode active">Play</button>
              <button id="discardModeBtn" class="mode">Discard</button>
            </div>
          </div>

          <div id="actionHelp" class="action-help"></div>
          <div id="hand" class="hand"></div>
        </section>
      </section>

      <section id="resultScreen" class="panel hidden">
        <div class="eyebrow">GAME OVER</div>
        <h2>Final Ranking</h2>
        <div id="ranking"></div>
        <button id="restartBtn" class="btn primary hidden">Back to Lobby</button>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
